<app-page-header
  [title]="isEditMode ? 'Editar produto' : 'Novo produto'"
  subtitle="Campos alinhados à validação do ProductRequest no backend."
>
  <a class="btn btn-secondary" routerLink="/products">Voltar à lista</a>
</app-page-header>

@if (isLoading()) {
  <app-loading-state message="Carregando produto..." />
} @else {
  <section class="surface form-card">
    <form class="stack" [formGroup]="productForm" (ngSubmit)="submit()">
      @if (formError()) {
        <div class="alert alert-error">{{ formError() }}</div>
      }

      <div class="field">
        <label for="name">Nome</label>
        <input id="name" type="text" formControlName="name" />
      </div>

      <div class="field">
        <label for="description">Descrição</label>
        <textarea id="description" rows="4" formControlName="description" maxlength="500"></textarea>
      </div>

      <div class="grid-two">
        <div class="field">
          <label for="price">Preço</label>
          <input id="price" type="number" step="0.01" min="0.01" formControlName="price" />
        </div>

        <div class="field">
          <label for="stockQuantity">Quantidade em estoque</label>
          <input id="stockQuantity" type="number" min="0" formControlName="stockQuantity" />
        </div>
      </div>

      <button class="btn btn-primary" type="submit" [disabled]="isSubmitting()">
        {{ isSubmitting() ? 'Salvando...' : 'Salvar produto' }}
      </button>
    </form>
  </section>
}

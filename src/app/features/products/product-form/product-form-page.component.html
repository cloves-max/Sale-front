<app-page-header
  [title]="isEditMode ? 'Edit product' : 'New product'"
  subtitle="Fields mirror ProductRequest validation from the backend."
>
  <a class="btn btn-secondary" routerLink="/products">Back to list</a>
</app-page-header>

@if (isLoading()) {
  <app-loading-state message="Loading product..." />
} @else {
  <section class="surface form-card">
    <form class="stack" [formGroup]="productForm" (ngSubmit)="submit()">
      @if (formError()) {
        <div class="alert alert-error">{{ formError() }}</div>
      }

      <div class="field">
        <label for="name">Name</label>
        <input id="name" type="text" formControlName="name" />
      </div>

      <div class="field">
        <label for="description">Description</label>
        <textarea id="description" rows="4" formControlName="description" maxlength="500"></textarea>
      </div>

      <div class="grid-two">
        <div class="field">
          <label for="price">Price</label>
          <input id="price" type="number" step="0.01" min="0.01" formControlName="price" />
        </div>

        <div class="field">
          <label for="stockQuantity">Stock quantity</label>
          <input id="stockQuantity" type="number" min="0" formControlName="stockQuantity" />
        </div>
      </div>

      <button class="btn btn-primary" type="submit" [disabled]="isSubmitting()">
        {{ isSubmitting() ? 'Saving...' : 'Save product' }}
      </button>
    </form>
  </section>
}

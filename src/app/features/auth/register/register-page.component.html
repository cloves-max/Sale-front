<section class="auth-panel surface">
  <div class="auth-panel__intro">
    <p class="eyebrow">Comece agora</p>
    <h1>Criar conta</h1>
    <p class="muted">Cadastre-se como ADMIN ou SELLER para usar a API de vendas.</p>
  </div>

  <form class="stack" [formGroup]="registerForm" (ngSubmit)="submit()">
    @if (formError()) {
      <div class="alert alert-error">{{ formError() }}</div>
    }

    <div class="field">
      <label for="name">Nome completo</label>
      <input id="name" type="text" formControlName="name" autocomplete="name" />
    </div>

    <div class="field">
      <label for="email">E-mail</label>
      <input id="email" type="email" formControlName="email" autocomplete="email" />
    </div>

    <div class="field">
      <label for="password">Senha</label>
      <input id="password" type="password" formControlName="password" autocomplete="new-password" />
    </div>

    <div class="field">
      <label for="role">Perfil</label>
      <select id="role" formControlName="role">
        @for (role of availableRoles; track role) {
          <option [value]="role">{{ role }}</option>
        }
      </select>
    </div>

    <button class="btn btn-primary" type="submit" [disabled]="isSubmitting()">
      {{ isSubmitting() ? 'Criando conta...' : 'Criar conta' }}
    </button>
  </form>

  <p class="muted">
    Já tem cadastro?
    <a routerLink="/auth/login">Entrar</a>
  </p>
</section>

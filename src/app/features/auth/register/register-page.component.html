<section class="auth-panel surface">
  <div class="auth-panel__intro">
    <p class="eyebrow">Comece agora</p>
    <h1>Criar conta</h1>
    <p class="muted">Cadastre-se como vendedor ou administrador para usar a API de vendas.</p>
  </div>

  <form class="stack" [formGroup]="registerForm" (ngSubmit)="submit()">
    @if (formError()) {
      <div class="alert alert-error">{{ formError() }}</div>
    }

    <div class="field">
      <label for="name">Nome completo</label>
      <input id="name" type="text" formControlName="name" autocomplete="name" />
    </div>

    <div class="field">
      <label for="email">E-mail</label>
      <input id="email" type="email" formControlName="email" autocomplete="email" />
    </div>

    <div class="field">
      <label for="password">Senha</label>
      <input id="password" type="password" formControlName="password" autocomplete="new-password" />
    </div>

    <fieldset class="field role-field">
      <legend>Perfil</legend>
      <div class="role-options" role="radiogroup" aria-label="Perfil">
        @for (role of roleOptions; track role.value) {
          <label class="role-option" [class.role-option--active]="registerForm.controls.role.value === role.value">
            <input type="radio" formControlName="role" [value]="role.value" />
            <span class="role-option__title">{{ role.label }}</span>
            <span class="role-option__hint">{{ role.hint }}</span>
          </label>
        }
      </div>
    </fieldset>

    <button class="btn btn-primary" type="submit" [disabled]="isSubmitting()">
      {{ isSubmitting() ? 'Criando conta...' : 'Criar conta' }}
    </button>
  </form>

  <p class="muted">
    Já tem cadastro?
    <a routerLink="/auth/login">Entrar</a>
  </p>
</section>

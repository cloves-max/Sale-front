<app-page-header title="New sale" subtitle="Seller is resolved from the JWT on the backend.">
  <a class="btn btn-secondary" routerLink="/sales">Back to sales</a>
</app-page-header>

@if (isLoading()) {
  <app-loading-state message="Loading products..." />
} @else {
  <section class="surface form-card">
    <form class="stack" [formGroup]="saleForm" (ngSubmit)="submit()">
      @if (formError()) {
        <div class="alert alert-error">{{ formError() }}</div>
      }

      <div formArrayName="items" class="stack">
        @for (itemControl of itemsFormArray.controls; track $index; let itemIndex = $index) {
          <div class="item-row" [formGroupName]="itemIndex">
            <div class="field">
              <label [attr.for]="'productId-' + itemIndex">Product</label>
              <select [id]="'productId-' + itemIndex" formControlName="productId">
                <option [value]="0" disabled>Select a product</option>
                @for (product of products(); track product.id) {
                  <option [value]="product.id">
                    {{ product.name }} — {{ product.price | currency: 'BRL' }} (stock
                    {{ product.stockQuantity }})
                  </option>
                }
              </select>
            </div>

            <div class="field">
              <label [attr.for]="'quantity-' + itemIndex">Quantity</label>
              <input
                [id]="'quantity-' + itemIndex"
                type="number"
                min="1"
                formControlName="quantity"
              />
            </div>

            <button type="button" class="btn btn-secondary" (click)="removeItem(itemIndex)">
              Remove
            </button>
          </div>
        }
      </div>

      <div class="row">
        <button type="button" class="btn btn-secondary" (click)="addItem()">Add item</button>
        <button class="btn btn-primary" type="submit" [disabled]="isSubmitting()">
          {{ isSubmitting() ? 'Creating...' : 'Create sale' }}
        </button>
      </div>
    </form>
  </section>
}
